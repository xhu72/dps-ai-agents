name: connect-four tests

on:
  push:
    paths:
      - "connect-four-game/**"
      - ".github/workflows/connect-four-game.yml"
  pull_request:
    paths:
      - "connect-four-game/**"
      - ".github/workflows/connect-four-game.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: pip install pytest

      - name: Run Connect Four tests
        working-directory: connect-four-game
        run: python -m pytest -v tests.py
